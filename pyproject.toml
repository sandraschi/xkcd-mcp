[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xkcd-mcp"
version = "0.4.0"
description = "FastMCP 3.2 xkcd server â€” official JSON API only (current / by number / random), no HTML scraping."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Sandra Schipal" }]
dependencies = [
    "fastmcp>=3.4.4,<4",
    "httpx>=0.27",
    "prefab-ui>=0.14.0",
    "starlette>=0.46",
    "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.16.0,<0.17", "pre-commit>=4"]

[project.urls]
Homepage = "https://github.com/sandraschi/xkcd-mcp"
Repository = "https://github.com/sandraschi/xkcd-mcp"
Issues = "https://github.com/sandraschi/xkcd-mcp/issues"

[project.scripts]
xkcd-mcp = "xkcd_mcp.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "S", "UP", "RUF"]
ignore = ["S104", "S310", "S311", "S314", "S608", "S108", "S603", "S301", "S103", "S112", "S105", "S607", "S701", "S102", "S307", "S324", "ASYNC230", "B008", "B904", "B025", "B019", "B023", "C901", "UP035", "RUF006", "N806", "E501", "F841", "PLW1510", "BLE001", "RUF022", "E402", "F811", "B006", "B007", "RUF059", "RUF001", "RUF002", "S110", "RUF012", "DTZ005", "DTZ006", "DTZ001", "E741", "SIM115", "SIM102", "RUF100", "F401", "D103", "D101", "F821", "TRY002", "S101", "B008", "S106", "S110", "S112", "S101", "B008", "S106", "S110", "S112", "RUF012", "S603", "S607", "S324", "E402", "E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
